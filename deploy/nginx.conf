# /etc/nginx/conf.d/alhaja.conf  (EC2 — Nginx sirve el frontend y hace proxy al API)
server {
    listen 80;
    server_name _;               # cambia por tu dominio

    root /var/www/alhaja;        # contenido de frontend/dist
    index index.html;
    client_max_body_size 6m;     # subida de imágenes (límite del API: 5 MB)

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location / { try_files $uri /index.html; }   # rutas de React Router
}
